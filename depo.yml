# Phase 7 — Configure passwordless SSH

Generate the key:

```bash
ssh-keygen -t rsa
```

When prompted, simply press **Enter** through the questions, as the lab specifies. 

Then copy the key to localhost:

```bash
ssh-copy-id -i ~/.ssh/id_rsa.pub osboxes@127.0.0.1
```

Enter:

```text
osboxes.org
```

as the password if your VM still uses the lab's default credentials.

Then test SSH:

```bash
ssh 127.0.0.1
```

If it logs you in without asking for the password, type:

```bash
exit
```

Now test Ansible without `-k`:

```bash
ansible 127.0.0.1 -m ping
```

This should succeed without requesting a password, which is the purpose of the SSH-key portion of the exercise. 


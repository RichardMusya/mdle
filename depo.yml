## Phase 2 — Clean the previous Ansible installation

Check what you currently have:

```bash
ansible --version
```

and:

```bash
python3 -m pip show ansible
```

If Ansible was installed with the lab's user-local method, remove it:

```bash
python3 -m pip uninstall -y ansible ansible-core
```

Also remove any old Galaxy role:

```bash
rm -rf ~/.ansible/roles/lean_delivery.jenkins
```

And remove the previous lab repository if you want a genuinely clean copy:

```bash
rm -rf ~/Projects/MSES602_ansible
```

We can recreate it later with:

```bash
git clone https://github.com/RegisUniversity/MSES602_ansible.git
```

which is the repository specified by the lab. 


# Phase 6 — Test Ansible/SSH before proceeding

Now run exactly what the lab asks:

```bash
ansible 127.0.0.1 -k -m ping
```

The lab actually expects this initial test to fail because `sshpass` has not yet been installed. 

Then install:

```bash
sudo apt-get update
sudo apt-get -y install sshpass
```

Now retry:

```bash
ansible 127.0.0.1 -k -m ping
```

Enter the VM password.

We want:

```text
127.0.0.1 | SUCCESS => {
    ...
    "ping": "pong"
}
```


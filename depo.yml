# Phase 4 — Install Ansible according to the lab

The lab specifically instructs:

```bash
python3 -m pip install --user ansible
```

and then requires `~/.local/bin` to be added to `PATH`. 

We'll follow that rather than introducing a completely different Ansible installation method.

First:

```bash
sudo apt-get update
```

Then make sure pip is available:

```bash
sudo apt-get install -y python3-pip
```

Then:

```bash
python3 -m pip install --user ansible
```

Add the required PATH:

```bash
echo 'export PATH="$PATH:$HOME/.local/bin"' >> ~/.bashrc
```

Reload it:

```bash
source ~/.bashrc
```

Then verify:

```bash
ansible --version
```

You should get an Ansible version rather than:

```text
command not found
```

---

# Phase 5 — Configure the Ansible inventory

The lab requires:

```text
/etc/ansible/hosts
```

and specifically asks you to create the directory and add:

```text
# localhost
127.0.0.1
```



Run:

```bash
sudo mkdir -p /etc/ansible
```

Then:

```bash
sudo nano /etc/ansible/hosts
```

Put:

```ini
# localhost
127.0.0.1
```

Save with:

**Ctrl+O → Enter → Ctrl+X**

Test:

```bash
ansible all --list-hosts
```

You should see something equivalent to:

```text
hosts (1):
    127.0.0.1
```


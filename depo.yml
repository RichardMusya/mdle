## Then we deal with the Jenkins plugin problem

Once Jenkins is installed, we'll **not assume that plugin installation will work**.

We'll first test:

```bash
sudo systemctl status jenkins --no-pager
```

then:

```bash
curl -I http://localhost:8080
```

and inspect the Jenkins logs:

```bash
sudo journalctl -u jenkins -n 100 --no-pager
```

We'll also test outbound HTTPS from the VM:

```bash
curl -I https://updates.jenkins.io
```

and:

```bash
curl -I https://plugins.jenkins.io
```

If those work but Jenkins still cannot install plugins, we'll diagnose the Jenkins update-center/proxy/certificate configuration rather than randomly reinstalling plugins.

The lab's expected final state is Jenkins accessible at:

```text
http://localhost:8080
```

followed by the common-plugin installation and inspection under **Manage Jenkins → Manage Plugins → Installed**. 

